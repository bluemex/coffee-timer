                                                        {stage.title}
                                                    </h3>
                                                    {isCurrent && (
                                                        <span className="hidden sm:inline-flex text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-500/15 text-amber-800 animate-pulse whitespace-nowrap shrink-0">
                                                            {stageElapsed < 15 ? '💧 注水繞圈中' : '⏳ 等待滴濾流乾'}
                                                        </span>
                                                    )}
                                                </div>

                                                <div className={`pl-3.5 border-l-[3px] py-0.5 ${
                                                    isCurrent ? 'border-amber-500' : isPreview ? 'border-amber-300' : 'border-stone-200'
                                                }`}>
                                                    <p className={`text-[13px] sm:text-xs leading-[1.7] tracking-[0.02em] font-medium ${
                                                        isCurrent ? 'text-amber-900' : 'text-stone-600'
                                                    }`}>
                                                        {stage.method}
                                                    </p>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="mt-4 flex justify-between items-center gap-2">
                                            <div className={`text-xs sm:text-[11px] font-mono font-bold px-3 py-1 rounded-full flex items-center gap-1.5 whitespace-nowrap ${
                                                isCurrent
                                                    ? 'bg-amber-200/90 text-amber-950 shadow-sm'
                                                    : isPreview
                                                    ? 'bg-amber-100/80 text-amber-900'
                                                    : 'bg-stone-100 text-stone-600'
                                            }`}>
                                                <Icon name="droplet" size={12} className={isCurrent || isPreview ? "text-amber-700" : "text-stone-400"} />
                                                <span>{stage.detail}</span>
                                            </div>
                                            <div className="flex items-center gap-2 shrink-0">
                                                <div className={`${isCurrent ? 'hidden sm:block text-amber-700 font-semibold' : 'text-stone-400'} text-xs sm:text-[11px] italic font-medium whitespace-nowrap`}>
                                                    {stage.effect}
                                                </div>
                                                {isCurrent && (
                                                    <button
                                                        type="button"
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            skipToNextStage();
                                                        }}
                                                        className="inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-1 rounded-full bg-amber-600 hover:bg-amber-500 text-white shadow-sm transition-all active:scale-95 whitespace-nowrap shrink-0"
                                                    >
                                                        <span>{idx < 4 ? '跳至下一段' : '完成沖煮'}</span>
                                                        <Icon name="skip-forward" size={11} />
                                                    </button>
                                                )}
                                                {isActive && !isFinished && !isCurrent && (
                                                    <button
                                                        type="button"
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            jumpToStage(idx);
                                                        }}
                                                        className="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full bg-stone-100 hover:bg-amber-100 text-stone-500 hover:text-amber-800 border border-stone-200 transition-all whitespace-nowrap shrink-0"
                                                    >
                                                        <span>跳至此段</span>
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        <div className="p-8 bg-stone-50 border-t border-stone-100 flex items-center justify-center text-stone-300">
                            <Icon name="info" size={16} className="mr-2 shrink-0 text-amber-600/70" />
                            <p className="text-xs sm:text-[11px] text-stone-400 italic">
                                本指南採用四六沖法黃金比例，引導每一分注水的萃取細節。
                            </p>
                        </div>
                    </div>

                    <footer className="mt-16 bg-stone-50 py-12 px-6 border-t border-stone-200">
                        <div className="max-w-2xl mx-auto text-center">
                            <ul className="flex justify-center items-center gap-8 mb-6">
                                <li>
                                    <a href="https://yooneko.com" className="hover:opacity-80 transition-opacity text-sm font-black tracking-tight flex items-center">
                                        <span style={{ color: '#ff6b81' }}>Yoo</span>
                                        <span style={{ color: '#2d3436' }}>Neko</span>
                                    </a>
                                </li>
                                <li><a href="https://yooneko.com/privacy.html" className="text-stone-500 hover:text-amber-600 transition-colors text-sm font-medium">隱私權政策</a></li>
                                <li><a href="https://yooneko.com/terms.html" className="text-stone-500 hover:text-amber-600 transition-colors text-sm font-medium">服務條款</a></li>
                            </ul>
                            <div className="text-stone-400 text-[9px] sm:text-[10px] tracking-[0.2em] uppercase mb-4 italic font-medium">Specialist Brewing Protocol · Optimized</div>
                            <p className="text-stone-400 text-xs sm:text-[11px] font-medium">© 2026 <span style={{ color: '#ff6b81' }}>Yoo</span><span style={{ color: '#2d3436' }}>Neko</span>. 本站為個人興趣分享。</p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
